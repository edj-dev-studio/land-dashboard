<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --muted: #898781;
  --border: #e6e5df; --accent: #1c5cab; --up: #c62f2f;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --muted: #898781;
    --border: #2c2c2a; --accent: #6da7ec; --up: #f07070;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--page); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
form {
  width: 100%; max-width: 320px; padding: 24px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--surface);
}
h1 { margin: 0 0 16px; font-size: 18px; }
input[type=password] {
  width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--page);
  border: 1px solid var(--border); border-radius: 8px;
}
label { display: flex; gap: 6px; align-items: center; margin: 12px 0; font-size: 13px; color: var(--muted); }
button {
  width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff;
  background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
}
button:disabled { opacity: .6; cursor: default; }
.error { min-height: 1.5em; margin: 8px 0 0; font-size: 13px; color: var(--up); }
</style>

<script>
(() => {
  const STORE_KEY = "land-dashboard-password";
  const payload = JSON.parse(document.getElementById("payload").textContent);
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  async function unlock(password) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: bytes(payload.salt), iterations: payload.iterations },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
    );
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.data));
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function remembered() {
    try { return localStorage.getItem(STORE_KEY); } catch { return null; }
  }

  function remember(password) {
    try {
      if (password) localStorage.setItem(STORE_KEY, password);
      else localStorage.removeItem(STORE_KEY);
    } catch { /* 저장소를 못 쓰면 매번 묻는다 */ }
  }

  const form = document.getElementById("gate");
  const error = document.getElementById("error");
  const button = document.getElementById("open");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("password").value;
    button.disabled = true;
    error.textContent = "";
    try {
      const html = await unlock(password);
      remember(document.getElementById("remember").checked ? password : null);
      show(html);
    } catch {
      error.textContent = "비밀번호가 맞지 않습니다.";
      button.disabled = false;
    }
  });

  const saved = remembered();
  if (saved) {
    unlock(saved).then(show, () => { remember(null); form.hidden = false; });
  } else {
    form.hidden = false;
  }
})();
</script>
